- name: Add SagerNet repository in deb822 format
  ansible.builtin.deb822_repository:
    allow_downgrade_to_insecure: false
    allow_insecure: false
    enabled: true
    signed_by: https://sing-box.app/gpg.key
    name: sagernet
    state: present
    uris: https://deb.sagernet.org/
