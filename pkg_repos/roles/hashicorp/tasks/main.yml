---
- name: Add HashiCorp repository in deb822 format
  ansible.builtin.deb822_repository:
    name: hashicorp
    state: present
    enabled: true
    signed_by: https://apt.releases.hashicorp.com/gpg
    uris: https://apt.releases.hashicorp.com/
    types: deb
    components: main
    suites: "*" # "{{ ansible_distribution_release | lower }}"
    architectures: "{{ dpkg_architecture_map[ansible_architecture] }}"
    allow_insecure: false
    allow_downgrade_to_insecure: false
  vars:
    dpkg_architecture_map:
      x86_64: amd64
      amd64: amd64
      aarch64: arm64
      arm64: arm64

- name: Install HashiCorp packages
  ansible.builtin.apt:
    update_cache: true
