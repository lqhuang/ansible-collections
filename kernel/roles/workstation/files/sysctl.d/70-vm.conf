


# Here workstation mostly requires 32GB or higher memory
# so we can set dirty ratios lower to improve responsiveness
#
# 32 GB * 0.02 = 655 MB
# 32 GB * 0.10 = 3276 MB
#
# https://lonesysadmin.net/2013/12/22/better-linux-disk-caching-performance-vm-dirty_ratio/
vm.dirty_ratio = 2
vm.dirty_background_ratio = 10
