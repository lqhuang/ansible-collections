;
; Profile level: essential (51)
;
# CVE-2026-98432
# Disable MPTCP by default. Only enable it if explicitly required by the application
net.mptcp.enabled = 0

# Essential source validation WireGuard (client side)
net.ipv4.conf.default.src_valid_mark = 1
net.ipv4.conf.all.src_valid_mark = 1

# Enable Network ECN
net.ipv4.tcp_ecn = 1
net.ipv4.tcp_ecn_fallback = 1

# Enable TCP moderate receive buffer auto-tuning
net.ipv4.tcp_moderate_rcvbuf = 1

# Enable reuse of TIME-WAIT sockets for new connections when it is safe from protocol viewpoint
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_timestamps = 1

# Enable the TCP selective acks option for better throughput:
net.ipv4.tcp_sack = 1

# IPv6 Privacy Extensions
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2
