;
; Profile level: security (90)
;

# Enable Address Space Layout Randomization (ASLR)
kernel.randomize_va_space = 2

# Enable forced cleanup of all IPC objects from processes that have terminated
kernel.shm_rmid_forced = 1

# Rrevent unprivileged users are from using `dmesg(8)` to view messages.
# Users must have `CAP_SYSLOG` to use `dmesg(8)`.
kernel.dmesg_restrict = 1

# Disable kernel symbol visibility to unprivileged users.
# Users must have `CAP_SYSLOG`
kernel.kptr_restrict = 1

# Disable unprivileged eBPF
kernel.unprivileged_bpf_disabled = 1
