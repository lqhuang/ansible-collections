;
; Profile level: role based (70)
;
; use case: network performance tuning
;

# Increasing the size of the connection tracking table (default 65536)
net.netfilter.nf_conntrack_max = 262144

# Increase number of incoming connections
net.core.somaxconn = 8192

# Increase number of incoming connections backlog
net.core.netdev_max_backlog = 65536

# Increate  this to leverage MSG_ZEROCOPY
# default is 131072 (128KB)
# tune for 100G NIC: 1048576 (1024KB)
net.core.optmem_max = 1048576

# Reduce the time TCP sockets stay in TIME_WAIT state
# Helps resist resource exhaustion attacks
net.ipv4.tcp_fin_timeout = 15

# Improve interactive latency by optimizing send buffer handling
net.ipv4.tcp_notsent_lowat = 131072

# Enable TCP advanced window scaling
# https://blog.cloudflare.com/optimizing-tcp-for-high-throughput-and-low-latency/
# https://github.com/klzgrad/naiveproxy/wiki/Performance-Tuning
net.ipv4.tcp_adv_win_scale = 1
net.ipv4.tcp_wmem = 8192 262144 67108864
net.ipv4.tcp_rmem = 4096 131072 67108864

