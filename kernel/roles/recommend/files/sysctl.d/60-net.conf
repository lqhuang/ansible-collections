;
; Profile level: recommended (60)
;

# Enable TCP-BBR
# net.core.default_qdisc = fq_codel
net.core.default_qdisc = cake
net.ipv4.tcp_congestion_control = bbr

# Increate  this to leverage MSG_ZEROCOPY
# default is 131072 (128KB)
# tune for 100G NIC: 1048576 (1024KB)
net.core.optmem_max = 524288

# https://github.com/quic-go/quic-go/wiki/UDP-Buffer-Sizes
#
# 16 MiB = 16777216 Bytes
net.core.rmem_max = 16777216
net.core.rmem_default = 16777216
net.core.wmem_max = 16777216
net.core.wmem_default = 16777216

# Enable Network ECN
# I cannot find the minimal kernel version that supports options greater than 2
# But I personally never use kernel older than 5.10 now
net.ipv4.tcp_ecn = 3

# Client side TCP send buffer
net.ipv4.tcp_adv_win_scale = 1
net.ipv4.tcp_rmem = 8192 131072 67108864

# TCP window scaling tries to avoid saturating the network adapter with
# incoming packets.
net.ipv4.tcp_window_scaling = 1

# Controls TCP Packetization-Layer Path MTU Discovery
# set 2 to always enabled, use initial MSS of `tcp_base_mss`.
net.ipv4.tcp_mtu_probing = 2

# Disable slow start after idle to improve performance on connections
net.ipv4.tcp_slow_start_after_idle = 0

# Disable TCP Fast Open to avoid distinct traffic signature
net.ipv4.tcp_fastopen = 0
