# While 524,288 is the maximum number of files that can be watched,
# if you're in an environment that is particularly memory-constrained,
# you might want to lower the number. Each file watch takes up 1,080 bytes,
# so assuming that all 524,288 watches are consumed, that results in an upper
# bound of around 540 MiB.
fs.inotify.max_user_watches=524288

