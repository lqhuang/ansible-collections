---
- name: Install sing-box package in Debian-based systems
  ansible.builtin.apt:
    name: "{{ singbox_beta | bool | ternary('sing-box-beta', 'sing-box') }}"
    clean: true
    state: present
  when: ansible_facts['os_family'] == 'Debian'
- name: Install sing-box package
  ansible.builtin.package:
    name: "{{ singbox_beta | bool | ternary('sing-box-beta', 'sing-box') }}"
    state: present
  when: ansible_facts['os_family'] != 'Debian'
