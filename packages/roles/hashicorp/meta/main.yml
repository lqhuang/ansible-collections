---
allow_duplicates: false

dependencies:
  - lqhuang.pkg_repos.hashicorp

argument_specs:
  main:
    options:
      hashicorp_packages_include:
        type: list
        elements: str
        default: []
      hashicorp_packages_exclude:
        type: list
        elements: str
        default: []
    mutually_exclusive:
      - hashicorp_packages_include
      - hashicorp_packages_exclude
