---
- name: Collect packages from preset list
  ansible.builtin.set_fact:
    _preset_packages: >-
      {{
        lookup('ansible.builtin.vars', '_' + item)
        | mandatory
        | union(_preset_packages | default([]))
      }}
  loop: "{{ preset_list | union(['common']) }}"

# - name: Collect packages from preset list
#   ansible.builtin.debug:
#     msg: "{{ _preset_packages }}"

- name: Ensure preset packages are installed
  ansible.builtin.apt:
    name: "{{ _preset_packages | unique }}"
    state: present
    update_cache: true
    autoclean: true
