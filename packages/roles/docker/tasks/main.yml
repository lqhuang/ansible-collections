---
- name: Add docker official repo and install docker packages
  ansible.builtin.include_role:
    name: geerlingguy.docker
  vars:
    docker_edition: ce
    docker_add_repo: true
    docker_users: "{{ docker_users | default([]) }}"
    docker_daemon_options: "{{ docker_daemon_options | default({}) }}"
