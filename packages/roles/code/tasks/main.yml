---
- name: Install code in Debian-based systems
  ansible.builtin.apt:
    name: "{{ code_insiders | bool | ternary('code-insiders', 'code') }}"
    clean: true
    state: present
  when: ansible_facts['pkg_mgr'] == 'apt'

- name: Install code package
  ansible.builtin.package:
    name: "{{ code_insiders | bool | ternary('code-insiders', 'code') }}"
    state: present
  when: ansible_facts['pkg_mgr'] != 'apt'
